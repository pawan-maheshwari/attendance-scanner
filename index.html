<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS ID Scanner - OCR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .scan-frame { position: relative; }
        .scan-frame::before {
            content: '';
            position: absolute;
            inset: 12%;
            border: 4px solid #22d3ee;
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.75);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <nav class="sticky top-0 bg-zinc-900 border-b border-zinc-700 p-4 flex justify-between items-center">
        <div>
            <span class="text-3xl font-black">tcs</span>
            <span class="ml-2 text-blue-400">COHORT PROGRAMS</span>
        </div>
        <div class="flex gap-4">
            <button onclick="exportToCSV()" class="text-xl"><i class="fa-solid fa-download"></i></button>
            <button onclick="clearData()" class="text-red-400 text-xl"><i class="fa-solid fa-trash"></i></button>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- Camera View -->
        <div class="bg-zinc-900 rounded-3xl p-4">
            <div class="flex justify-between items-center mb-4 px-2">
                <div class="flex items-center gap-2">
                    <span class="text-green-400">●</span>
                    <span class="font-medium">Live Camera</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="switchCamera()" class="px-4 py-2 bg-zinc-800 rounded-2xl text-sm flex items-center gap-1">
                        <i class="fa-solid fa-camera-rotate"></i> Switch
                    </button>
                </div>
            </div>

            <div class="scan-frame rounded-3xl overflow-hidden bg-black border-4 border-cyan-400 aspect-square">
                <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <div class="mt-4">
                <button onclick="captureAndExtract()" id="capture-btn"
                        class="w-full py-5 bg-white text-black rounded-3xl font-bold text-xl flex items-center justify-center gap-3">
                    <i class="fa-solid fa-camera"></i> CAPTURE & EXTRACT TEXT
                </button>
            </div>
        </div>

        <!-- Extracted Info -->
        <div id="extracted-box" class="hidden bg-zinc-900 rounded-3xl p-6">
            <div class="text-emerald-400 text-xs mb-1">EXTRACTED FROM ID CARD</div>
            <div class="space-y-2 text-lg">
                <div><span class="text-zinc-400">Name:</span> <span id="extracted-name" class="font-semibold"></span></div>
                <div><span class="text-zinc-400">Card No:</span> <span id="extracted-id" class="font-mono font-semibold"></span></div>
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="markAttendanceFromExtracted()" class="flex-1 py-4 bg-emerald-500 rounded-2xl font-semibold">MARK ATTENDANCE</button>
                <button onclick="cancelExtracted()" class="flex-1 py-4 bg-zinc-800 rounded-2xl">Cancel</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-xs text-emerald-400">TODAY</div>
                <div id="stat-today" class="text-6xl font-bold">0</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-xs text-blue-400">TOTAL</div>
                <div id="stat-total" class="text-6xl font-bold">0</div>
            </div>
        </div>
    </div>

    <script>
        let stream = null;
        let currentFacing = "environment";
        let records = [];
        let extractedData = null;

        async function startCamera() {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacing }
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        }

        function switchCamera() {
            currentFacing = currentFacing === "environment" ? "user" : "environment";
            startCamera();
        }

        async function captureAndExtract() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const btn = document.getElementById('capture-btn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> READING ID CARD...`;
            btn.disabled = true;

            try {
                const { data: { text } } = await Tesseract.recognize(
                    canvas,
                    'eng',
                    { logger: m => console.log(m) }
                );

                console.log("OCR Result:", text);

                // Parse TCS ID card text
                const nameMatch = text.match(/([A-Z][A-Z\s]+MAHESHWARI)/i) || 
                                 text.match(/([A-Z][A-Z\s]+)/);
                const cardMatch = text.match(/Card No\s*(\d+)/i) || 
                                 text.match(/(\d{6,})/);

                const name = nameMatch ? nameMatch[1].trim() : "Unknown";
                const cardNo = cardMatch ? cardMatch[1] : "Unknown";

                extractedData = { userName: name, userId: cardNo };

                // Show extracted info
                document.getElementById('extracted-name').textContent = name;
                document.getElementById('extracted-id').textContent = cardNo;
                document.getElementById('extracted-box').classList.remove('hidden');

            } catch (err) {
                alert("OCR failed. Please try again with better lighting.");
                console.error(err);
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-camera"></i> CAPTURE & EXTRACT TEXT`;
                btn.disabled = false;
            }
        }

        function markAttendanceFromExtracted() {
            if (!extractedData) return;
            records.unshift({
                ...extractedData,
                time: new Date().toLocaleTimeString()
            });
            updateStats();
            document.getElementById('extracted-box').classList.add('hidden');
            alert(`✅ Attendance marked for ${extractedData.userName}`);
            extractedData = null;
        }

        function cancelExtracted() {
            document.getElementById('extracted-box').classList.add('hidden');
            extractedData = null;
        }

        function updateStats() {
            document.getElementById('stat-today').textContent = records.length;
            document.getElementById('stat-total').textContent = records.length;
        }

        function exportToCSV() {
            if (!records.length) return alert("No records yet");
            let csv = "Name,Card No,Time\n";
            records.forEach(r => csv += `"${r.userName}","${r.userId}","${r.time}"\n`);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
            a.download = "tcs_attendance.csv";
            a.click();
        }

        function clearData() {
            if (confirm("Clear all attendance records?")) {
                records = [];
                updateStats();
            }
        }

        // Boot camera
        window.onload = () => {
            startCamera();
            updateStats();
        };
    </script>
</body>
</html>

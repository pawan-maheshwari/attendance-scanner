<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS Cohort Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .scan-frame::before {
            content: '';
            position: absolute;
            inset: 10%;
            border: 5px solid #22d3ee;
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.8);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <nav class="sticky top-0 bg-zinc-900 border-b border-zinc-700 p-4 flex justify-between items-center">
        <div>
            <span class="text-3xl font-black">tcs</span>
            <span class="ml-2 text-blue-400">COHORT PROGRAMS</span>
        </div>
        <div class="flex gap-4">
            <button onclick="exportToCSV()" class="text-xl"><i class="fa-solid fa-download"></i></button>
            <button onclick="clearData()" class="text-red-400 text-xl"><i class="fa-solid fa-trash"></i></button>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- Live Camera -->
        <div class="bg-zinc-900 rounded-3xl p-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-green-400">●</span> Live Camera
                </div>
                <button onclick="switchCamera()" class="px-5 py-2 bg-zinc-800 rounded-2xl text-sm">Switch</button>
            </div>

            <div class="scan-frame rounded-3xl overflow-hidden border-4 border-cyan-400 bg-black aspect-square relative">
                <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <button onclick="captureAndExtract()" id="capture-btn"
                    class="mt-5 w-full py-6 bg-white text-black rounded-3xl font-bold text-xl">
                📸 CAPTURE ID CARD
            </button>
        </div>

        <!-- Extracted -->
        <div id="extracted-box" class="hidden bg-zinc-900 rounded-3xl p-6">
            <div class="text-emerald-400 text-xs">EXTRACTED</div>
            <div class="mt-4 space-y-4">
                <input id="name-input" class="w-full bg-zinc-800 p-4 rounded-2xl text-lg" placeholder="Name">
                <input id="id-input" class="w-full bg-zinc-800 p-4 rounded-2xl text-lg" placeholder="Card No">
                <input id="assoc-input" class="w-full bg-zinc-800 p-4 rounded-2xl text-lg" placeholder="Associate No">
            </div>
            <button onclick="markAttendance()" class="mt-6 w-full py-5 bg-emerald-500 rounded-3xl font-bold text-lg">✅ MARK ATTENDANCE</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4 text-center">
            <div class="bg-zinc-900 rounded-3xl p-6">
                <div class="text-emerald-400 text-xs">TODAY</div>
                <div id="stat-today" class="text-6xl font-bold">0</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-6">
                <div class="text-blue-400 text-xs">TOTAL</div>
                <div id="stat-total" class="text-6xl font-bold">0</div>
            </div>
        </div>
    </div>

    <script>
        let stream = null;
        let currentFacing = "environment";
        let records = [];

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
            document.getElementById('video').srcObject = stream;
        }

        function switchCamera() {
            currentFacing = currentFacing === "environment" ? "user" : "environment";
            startCamera();
        }

        async function captureAndExtract() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // Crop to the cyan frame (inset: 10%)
            const cropX = video.videoWidth * 0.1;
            const cropY = video.videoHeight * 0.1;
            const cropWidth = video.videoWidth * 0.8;
            const cropHeight = video.videoHeight * 0.8;

            canvas.width = cropWidth;
            canvas.height = cropHeight;
            ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            const btn = document.getElementById('capture-btn');
            btn.disabled = true;
            btn.textContent = "READING (KEEP STEADY)...";

            try {
                const { data: { text } } = await Tesseract.recognize(canvas, 'eng', { 
                    tessedit_pageseg_mode: 11 
                });

                console.log("Raw OCR:", text);

                let nameMatch = text.match(/[A-Z][A-Z\s]{8,40}/); 
                let name = nameMatch ? nameMatch[0].trim() : "";

                let cardMatch = text.match(/(?:Card|Cerd)[^\d]*(\d{5,})/i) || text.match(/(\d{6,})/);
                let cardNo = cardMatch ? cardMatch[1] : "";

                let assocMatch = text.match(/(?:Associate|Assoc)[^\d]*(\d{5,})/i);
                let assoc = assocMatch ? assocMatch[1] : "";

                document.getElementById('name-input').value = name;
                document.getElementById('id-input').value = cardNo;
                document.getElementById('assoc-input').value = assoc;

                document.getElementById('extracted-box').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                alert("OCR failed. Fill manually.");
                document.getElementById('extracted-box').classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = "📸 CAPTURE ID CARD";
            }
        }

        function markAttendance() {
            const name = document.getElementById('name-input').value.trim();
            const id = document.getElementById('id-input').value.trim();
            const assoc = document.getElementById('assoc-input').value.trim();

            if (!name) return alert("Enter name");

            records.unshift({
                userName: name,
                userId: id || "Unknown",
                associateNo: assoc,
                time: new Date().toLocaleTimeString()
            });

            updateStats();
            document.getElementById('extracted-box').classList.add('hidden');
            alert(`✅ Marked: ${name}`);
        }

        function updateStats() {
            document.getElementById('stat-today').textContent = records.length;
            document.getElementById('stat-total').textContent = records.length;
        }

        function exportToCSV() {
            if (!records.length) return alert("No records");
            let csv = "Name,Card No,Associate No,Time\n";
            records.forEach(r => csv += `"${r.userName}","${r.userId}","${r.associateNo || ''}","${r.time}"\n`);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            a.download = 'cohort_attendance.csv';
            a.click();
        }

        function clearData() {
            if (confirm("Clear all?")) {
                records = [];
                updateStats();
            }
        }

        window.onload = () => {
            startCamera();
            updateStats();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS ID Scanner - OCR Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .scan-frame::before {
            content: '';
            position: absolute;
            inset: 12%;
            border: 4px solid #22d3ee;
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.75);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <nav class="sticky top-0 bg-zinc-900 border-b border-zinc-700 p-4 flex justify-between items-center">
        <div>
            <span class="text-3xl font-black">tcs</span>
            <span class="ml-2 text-blue-400">COHORT PROGRAMS</span>
        </div>
        <div class="flex gap-4">
            <button onclick="exportToCSV()" class="text-xl"><i class="fa-solid fa-download"></i></button>
            <button onclick="clearData()" class="text-red-400 text-xl"><i class="fa-solid fa-trash"></i></button>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- Camera -->
        <div class="bg-zinc-900 rounded-3xl p-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 font-medium">
                    <span class="text-green-400">●</span> Live Camera
                </div>
                <button onclick="switchCamera()" class="px-5 py-2 bg-zinc-800 rounded-2xl text-sm flex items-center gap-1">
                    <i class="fa-solid fa-camera-rotate"></i> Switch
                </button>
            </div>

            <div class="scan-frame rounded-3xl overflow-hidden border-4 border-cyan-400 bg-black aspect-square relative">
                <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <button onclick="captureAndExtract()" id="capture-btn"
                    class="mt-5 w-full py-5 bg-white text-black rounded-3xl font-bold flex items-center justify-center gap-3">
                <i class="fa-solid fa-camera"></i> CAPTURE & EXTRACT TEXT
            </button>
        </div>

        <!-- Extracted -->
        <div id="extracted-box" class="hidden bg-zinc-900 rounded-3xl p-6">
            <div class="text-emerald-400 text-xs">EXTRACTED FROM ID CARD</div>
            <div class="mt-4 space-y-3">
                <div class="flex justify-between">
                    <span class="text-zinc-400">Name</span>
                    <span id="extracted-name" class="font-semibold text-right"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-zinc-400">Card No</span>
                    <span id="extracted-id" class="font-mono font-semibold"></span>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="markAttendanceFromExtracted()" class="flex-1 py-4 bg-emerald-500 rounded-2xl font-semibold">MARK ATTENDANCE</button>
                <button onclick="cancelExtracted()" class="flex-1 py-4 bg-zinc-800 rounded-2xl">Cancel</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-emerald-400 text-xs">TODAY</div>
                <div id="stat-today" class="text-6xl font-bold">0</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-blue-400 text-xs">TOTAL</div>
                <div id="stat-total" class="text-6xl font-bold">0</div>
            </div>
        </div>
    </div>

    <script>
        let stream = null;
        let currentFacing = "environment";
        let records = [];
        let extractedData = null;

        async function startCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
                document.getElementById('video').srcObject = stream;
            } catch (e) {
                alert("Camera permission needed");
            }
        }

        function switchCamera() {
            currentFacing = currentFacing === "environment" ? "user" : "environment";
            startCamera();
        }

        async function captureAndExtract() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const btn = document.getElementById('capture-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

            try {
                // Preprocess: grayscale + contrast
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const gray = data[i] * 0.3 + data[i+1] * 0.59 + data[i+2] * 0.11;
                    data[i] = data[i+1] = data[i+2] = Math.min(255, gray * 1.3); // contrast boost
                }
                ctx.putImageData(imageData, 0, 0);

                const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
                    logger: m => console.log(m),
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -.,'
                });

                console.log("OCR:", text);

                // Improved parsing for TCS card
                let name = "Unknown";
                let cardNo = "Unknown";

                const nameMatch = text.match(/PAWAN MAHESHWARI/i) || text.match(/[A-Z][A-Z\s]{5,30}/);
                if (nameMatch) name = nameMatch[0].trim();

                const cardMatch = text.match(/Card No\s*(\d+)/i) || text.match(/(\d{5,8})/);
                if (cardMatch) cardNo = cardMatch[1];

                extractedData = { userName: name, userId: cardNo };

                document.getElementById('extracted-name').textContent = name;
                document.getElementById('extracted-id').textContent = cardNo;
                document.getElementById('extracted-box').classList.remove('hidden');

            } catch (err) {
                alert("OCR failed. Try better lighting and steady hand.");
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-camera"></i> CAPTURE & EXTRACT TEXT`;
            }
        }

        function markAttendanceFromExtracted() {
            if (!extractedData) return;
            records.unshift({
                ...extractedData,
                time: new Date().toLocaleTimeString()
            });
            updateStats();
            document.getElementById('extracted-box').classList.add('hidden');
            alert(`✅ Marked: ${extractedData.userName}`);
            extractedData = null;
        }

        function cancelExtracted() {
            document.getElementById('extracted-box').classList.add('hidden');
            extractedData = null;
        }

        function updateStats() {
            document.getElementById('stat-today').textContent = records.length;
            document.getElementById('stat-total').textContent = records.length;
        }

        function exportToCSV() {
            if (!records.length) return alert("No records");
            let csv = "Name,Card No,Time\n";
            records.forEach(r => csv += `"${r.userName}","${r.userId}","${r.time}"\n`);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            a.download = 'attendance.csv';
            a.click();
        }

        function clearData() {
            if (confirm("Clear all?")) {
                records = [];
                updateStats();
            }
        }

        window.onload = () => {
            startCamera();
            updateStats();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS Cohort Attendance Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; }
        .scan-frame::before {
            content: '';
            position: absolute;
            inset: 15%;
            border: 3px solid #22d3ee;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.7);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

    <nav class="sticky top-0 bg-zinc-900 border-b border-zinc-800 p-4 flex items-center justify-between">
        <div>
            <span class="text-3xl font-black">tcs</span>
            <span class="ml-2 text-blue-400 text-sm">COHORT PROGRAMS</span>
        </div>
        <div class="flex gap-4">
            <button onclick="exportToCSV()" class="text-lg"><i class="fa-solid fa-download"></i></button>
            <button onclick="clearData()" class="text-red-400 text-lg"><i class="fa-solid fa-trash"></i></button>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4">
        <!-- CTA -->
        <div class="bg-zinc-900 rounded-3xl p-8 mb-6">
            <button onclick="toggleScanner()" id="start-btn" class="w-full py-5 bg-white text-black rounded-2xl font-bold text-xl flex items-center justify-center gap-3">
                <i class="fa-solid fa-camera"></i> START SCANNER
            </button>
        </div>

        <!-- Live Scanner -->
        <div class="bg-zinc-900 rounded-3xl p-4 mb-6">
            <div class="flex justify-between items-center mb-4 px-2">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                    <span class="font-medium">Live Scanner</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="switchCamera()" class="px-5 py-2 bg-zinc-800 rounded-2xl text-sm flex items-center gap-1">
                        <i class="fa-solid fa-camera-rotate"></i> Switch
                    </button>
                    <button onclick="toggleScanner()" class="px-5 py-2 bg-zinc-800 rounded-2xl text-sm">Pause</button>
                </div>
            </div>
            
            <div id="scanner-container" class="hidden relative rounded-2xl overflow-hidden border-4 border-cyan-400 bg-black" style="aspect-ratio: 1;">
                <div id="qr-reader" class="w-full h-full"></div>
            </div>
            
            <div id="placeholder" class="text-center py-16">
                <i class="fa-solid fa-camera text-7xl text-zinc-600 mb-4"></i>
                <p class="text-lg">Ready — Flash ID Card</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-emerald-400 text-xs">TODAY</div>
                <div id="stat-today" class="text-6xl font-bold">0</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-6 text-center">
                <div class="text-blue-400 text-xs">TOTAL</div>
                <div id="stat-total" class="text-6xl font-bold">0</div>
            </div>
        </div>
    </div>

    <script>
        let scanner = null;
        let currentFacingMode = "environment";
        let attendanceRecords = [];

        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            const placeholder = document.getElementById('placeholder');
            
            if (scanner) {
                scanner.stop();
                scanner = null;
                container.classList.add('hidden');
                placeholder.classList.remove('hidden');
                document.getElementById('start-btn').textContent = 'START SCANNER';
            } else {
                container.classList.remove('hidden');
                placeholder.classList.add('hidden');
                startScanner();
            }
        }

        function startScanner() {
            const readerDiv = document.getElementById('qr-reader');
            readerDiv.innerHTML = '';
            
            scanner = new Html5Qrcode("qr-reader");
            
            scanner.start(
                { facingMode: currentFacingMode },
                {
                    fps: 20,
                    qrbox: { width: 320, height: 320 },
                    aspectRatio: 1.0
                },
                (decodedText) => {
                    const data = parseIdData(decodedText);
                    if (data.userName && data.userId) {
                        if (confirm(`Mark attendance for ${data.userName}?`)) {
                            markAttendance(data.userId, data.userName);
                        }
                    }
                },
                (error) => {} // silent
            ).catch(err => {
                alert("Camera error: " + err);
            });
        }

        function switchCamera() {
            if (!scanner) return;
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            scanner.stop().then(() => startScanner());
        }

        function parseIdData(raw) {
            try {
                const json = JSON.parse(raw);
                return { userId: json.userId || json.id || raw, userName: json.userName || "User" };
            } catch(e) {}
            if (raw.includes('|')) {
                const [id, name] = raw.split('|');
                return { userId: id.trim(), userName: name ? name.trim() : "User" };
            }
            return { userId: raw, userName: "ID Card" };
        }

        function markAttendance(userId, userName) {
            attendanceRecords.unshift({
                userId, userName, time: new Date().toLocaleTimeString()
            });
            updateStats();
            alert(`✅ Attendance marked for ${userName}`);
        }

        function updateStats() {
            document.getElementById('stat-today').textContent = attendanceRecords.length;
            document.getElementById('stat-total').textContent = attendanceRecords.length;
        }

        function openManualEntry() {
            const id = prompt("User ID");
            const name = prompt("Full Name");
            if (id && name) markAttendance(id, name);
        }

        function exportToCSV() {
            if (!attendanceRecords.length) return alert("No records");
            let csv = "User ID,Name,Time\n";
            attendanceRecords.forEach(r => csv += `${r.userId},${r.userName},${r.time}\n`);
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
            link.download = 'attendance.csv';
            link.click();
        }

        function clearData() {
            if (confirm("Clear all records?")) {
                attendanceRecords = [];
                updateStats();
            }
        }

        // Boot
        window.onload = () => updateStats();
    </script>
</body>
</html>
